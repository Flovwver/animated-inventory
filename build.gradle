plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
repositories { mavenCentral(); maven { url = 'https://maven.shedaniel.me/' } }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge {
    enable {
        version = neo_version
        disableRecompilation = true
    }
    runs { client { client() } }
    mods { inventorygif { sourceSet sourceSets.main } }
}
dependencies {
    neoFormRuntimeExternalTools 'net.neoforged.installertools:binarypatcher:4.0.17:fatjar'
    implementation files("libs/cloth-config-neoforge-${cloth_config_version}.jar")
    implementation 'me.shedaniel.cloth:basic-math:0.6.1'
    implementation 'com.electronwill.night-config:toml:3.8.3'
    jarJar 'com.electronwill.night-config:toml:3.8.3'
    jarJar 'com.electronwill.night-config:core:3.8.3'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

// Keep game tooling on NeoForged Maven and ordinary libraries on Maven Central.
repositories.configureEach {
    if (url.toString().contains('neoforged.net')) {
        content { excludeGroup 'com.electronwill.night-config'; excludeGroup 'me.shedaniel.cloth' }
    }
}
