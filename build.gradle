plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
repositories {
    maven { url = 'https://maven.shedaniel.me/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Official Cloth Config artifact, vendored because full downloads time out on its Maven host.
    implementation files("libs/cloth-config-fabric-${cloth_config_version}.jar")
    implementation "me.shedaniel.cloth:basic-math:0.6.1"
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

dependencies {
    implementation 'com.electronwill.night-config:toml:3.8.3'
    include 'com.electronwill.night-config:toml:3.8.3'
    include 'com.electronwill.night-config:core:3.8.3'
}
